baseURL: https://jiangbyte.github.io/
title: Charlie Zhang
locale: zh-CN
defaultContentLanguage: zh-cn
timeZone: Asia/Shanghai
enableRobotsTXT: true
enableGitInfo: false
theme: solitude

uglyURLs:
  posts: true

outputs:
  home: [HTML, RSS, Search, Links]
  section: [HTML, RSS]
  taxonomy: [HTML, RSS]
  term: [HTML, RSS]

pagination:
  pagerSize: 12

permalinks:
  posts: /p/:slug

menus:
  main:
    - name: 文库
      identifier: library
      weight: 10
      params:
        icon: fas fa-book
    - name: 全部文章
      pageRef: /archives
      parent: library
      weight: 10
      params:
        icon: fas fa-folder-closed
    - name: 全部分类
      pageRef: /categories
      parent: library
      weight: 20
      params:
        icon: fas fa-clone
    - name: 全部标签
      pageRef: /tags
      parent: library
      weight: 30
      params:
        icon: fas fa-tags
    - name: 关于
      pageRef: /about
      weight: 20
      params:
        icon: fas fa-user
    - name: GitHub
      url: https://github.com/jiangbyte
      weight: 30
      params:
        icon: fab fa-github

params:
  author:
    name: Charlie Zhang
    email: ""
  description: Charlie Zhang 的个人笔记与实践记录
  solitude:
    site:
      name:
        class: text
        custom: Charlie Zhang
    nav:
      group:
        链接:
          - name: GitHub
            url: https://github.com/jiangbyte
            icon: /img/logo.png
          - name: Resume
            url: https://jiangbyte.cn/resume
            icon: /img/logo.png
    hometop:
      banner:
        title: Charlie Zhang
        desc: Charlie Zhang 的笔记与实践记录
      recommendList: []
    aside:
      home:
        noSticky: about
        Sticky: newestPost,allInfo
      post:
        noSticky: about
        Sticky: newestPost,allInfo
      page:
        noSticky: about
        Sticky: newestPost,allInfo
      my_card:
        author:
          img: https://github.com/jiangbyte.png
          emoji: ""
        description: Programming enthusiast based in GZ, CN.
        content: 笔记同步自 jiangbyte/Notes，使用 Solitude 主题构建。
        witty_words: [写清楚，再优化, 先跑通，再抽象]
        information:
          - name: GitHub
            url: https://github.com/jiangbyte
            icon: fab fa-github
      siteinfo:
        runtime: 2026-10-01 00:00:00
    post:
      default:
        # 无封面时轮换；同步时也会写入稳定栗次元 cover（见 data/covers.yaml）
        cover:
          - https://t.alcy.cc/pic/pc/11203ff07c6e01317b8bb08ee6814a8e_cde8cc.webp
          - https://t.alcy.cc/pic/pc/11ae7b1f420937be19229d79918566de.webp
          - https://t.alcy.cc/pic/pc/15d9199ac8fe3a029f5bef6140adbd98.webp
          - https://t.alcy.cc/pic/pc/2025-10-4058489f725461d5a781d52f2e78a72c.webp
          - https://t.alcy.cc/pic/pc/2025-10-531c061ee5de5eef8fa143592125c496.webp
          - https://t.alcy.cc/pic/pc/2025-10-b70789595781db664558b22729d9c8eb.webp
          - https://t.alcy.cc/pic/pc/2025-10-eacc839c9e313fba1871fde55304b5d0.webp
          - https://t.alcy.cc/pic/pc/2025-11-1fbc794c445f83a9ffe6a3c79b91eae2.webp
          - https://t.alcy.cc/pic/pc/2025-11-a22666a2925f80a61d846af000c2ff60.webp
          - https://t.alcy.cc/pic/pc/2025-12-18-283f9a7ea8e9f38fd014d78ea118f2b1.webp
          - https://t.alcy.cc/pic/pc/2026-04-14-f1fd01120b9f862b49c3a33fd9ee0260.webp
          - https://t.alcy.cc/pic/pc/27d07078f0d027d71409be4ac62dbe63.webp
          - https://t.alcy.cc/pic/pc/347.webp
          - https://t.alcy.cc/pic/pc/360.webp
          - https://t.alcy.cc/pic/pc/361.webp
          - https://t.alcy.cc/pic/pc/365.webp
          - https://t.alcy.cc/pic/pc/375.webp
          - https://t.alcy.cc/pic/pc/413.webp
          - https://t.alcy.cc/pic/pc/416.webp
          - https://t.alcy.cc/pic/pc/442.webp
          - https://t.alcy.cc/pic/pc/470.webp
          - https://t.alcy.cc/pic/pc/476.webp
          - https://t.alcy.cc/pic/pc/499.webp
          - https://t.alcy.cc/pic/pc/518.webp
        copyright:
          author_background: ""
      meta:
        pv: false
        comment: false
      covercolor:
        enable: true
        mode: local
      award:
        enable: false
        list: []
      share:
        enable: false
        list: []
    footer:
      information:
        author: /img/logo.png
        left:
          - name: GitHub
            url: https://github.com/jiangbyte
            icon: fab fa-github
        right:
          - name: 订阅
            url: /index.xml
            icon: fas fa-rss
      group:
        探索:
          - name: 文章
            url: /archives/
          - name: 分类
            url: /categories/
          - name: 标签
            url: /tags/
        关于:
          - name: 关于
            url: /about/
          - name: Resume
            url: https://jiangbyte.cn/resume
      links:
        - name: 订阅
          url: /index.xml
    comment:
      use: ""
      commentBarrage: false
      lazyload: false
      count: false
      sidebar: false
      pv: false
      newest_comment:
        enable: false
    console:
      recentComment:
        enable: false
    right_menu:
      commentBarrage: false
    recent_comments:
      enable: false
    brevity:
      enable: false
    envelope:
      enable: false
    capsule:
      enable: false
    music:
      enable: false
    keyboard:
      enable: true
      list:
        - modifier: shift
          key: K
          action: toggleKeyboard
        - modifier: shift
          key: D
          action: toggleTheme
        - modifier: mod
          key: F
          action: openSearch
        - modifier: shift
          key: R
          action: randomPost
        - name: 返回首页
          modifier: shift
          key: H
          url: ./
    highlight:
      enable: true
      copy: true
      line_numbers: true
      max_height: 360
      themes:
        light: github-light
        dark: github-dark
    lightbox: fancybox
    cdn:
      shiki: https://esm.sh/shiki@4.4.3
    search:
      enable: true
      type: local
      local:
        preload: true
        CDN: /search.xml
