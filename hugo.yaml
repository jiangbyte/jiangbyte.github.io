baseURL: https://jiangbyte.github.io/
title: 撷时录
locale: zh-CN
defaultContentLanguage: zh-cn
timeZone: Asia/Shanghai
enableRobotsTXT: true
enableGitInfo: false
theme: solitude

uglyURLs:
  posts: true

outputs:
  home: [HTML, RSS, Search, Links]
  section: [HTML, RSS]
  taxonomy: [HTML, RSS]
  term: [HTML, RSS]

pagination:
  pagerSize: 12

permalinks:
  posts: /p/:slug

menus:
  main:
    - name: 文库
      identifier: library
      weight: 10
    - name: 全部文章
      pageRef: /archives
      parent: library
      weight: 10
      params:
        icon: fas fa-folder-closed
    - name: 全部分类
      pageRef: /categories
      parent: library
      weight: 20
      params:
        icon: fas fa-clone
    - name: 全部标签
      pageRef: /tags
      parent: library
      weight: 30
      params:
        icon: fas fa-tags
    - name: 关于
      pageRef: /about
      weight: 20
    - name: GitHub
      url: https://github.com/jiangbyte
      weight: 30

params:
  author:
    name: Charlie
    email: ""
  description: Charlie 的个人笔记与实践记录 · 撷时录
  solitude:
    site:
      name:
        class: text
        custom: 撷时录
      icon: https://avatars.githubusercontent.com/u/116237950?v=4
    nav:
      group:
        链接:
          - name: GitHub
            url: https://github.com/jiangbyte
            icon: /img/logo.png
          - name: Resume
            url: https://jiangbyte.cn/resume
            icon: /img/logo.png
    hometop:
      banner:
        title: 撷时录
        desc: Charlie 的笔记与实践记录
      recommendList: []
    aside:
      home:
        noSticky: about
        Sticky: newestPost,allInfo
      post:
        noSticky: about
        Sticky: newestPost,allInfo
      page:
        noSticky: about
        Sticky: newestPost,allInfo
      my_card:
        author:
          img: https://avatars.githubusercontent.com/u/116237950?v=4
          emoji: ""
        # 信息卡背景图（沉浸式）
        background: https://t.alcy.cc/pic/pc/11203ff07c6e01317b8bb08ee6814a8e_cde8cc.webp
        description: Programming enthusiast based in GZ, CN.
        content: 写清楚，再优化 · 先跑通，再抽象
        witty_words: [写清楚，再优化, 先跑通，再抽象]
        information:
          - name: GitHub
            url: https://github.com/jiangbyte
            icon: fab fa-github
      siteinfo:
        runtime: 2026-10-01 00:00:00
    post:
      default:
        # 无封面时轮换；同步写入来自 https://t.alcy.cc/ycy 的稳定直链（见 data/covers.yaml）
        cover:
          - https://t.alcy.cc/pic/pc/11203ff07c6e01317b8bb08ee6814a8e_cde8cc.webp
          - https://t.alcy.cc/pic/pc/2025-10-38efe905569baa831760180f86f433ce.webp
          - https://t.alcy.cc/pic/pc/2025-10-5dd032f4e704e3d2956476bc7eafef7f.webp
          - https://t.alcy.cc/pic/pc/2025-10-894204114a20079d919c9035f567acb1.webp
          - https://t.alcy.cc/pic/pc/2025-10-b6c47683362113669c8d6b037b45a19d.webp
          - https://t.alcy.cc/pic/pc/2025-10-d9681d46c56ca3a41d5838d7d0af61ab.webp
          - https://t.alcy.cc/pic/pc/2025-11-6f7a5545758f27b6d3defe1be03830ce.webp
          - https://t.alcy.cc/pic/pc/2025-12-18-0ad59fd83e56b4d7bfd1354053933b75.webp
          - https://t.alcy.cc/pic/pc/2025-12-18-451d16129ce2ab4ffa4576d186c909dd.webp
          - https://t.alcy.cc/pic/pc/2025-12-18-8081a888264a95cefb62643036d02b9c.webp
          - https://t.alcy.cc/pic/pc/2025-12-18-c10cf3704d308bbeba871eb0d0dfb653.webp
          - https://t.alcy.cc/pic/pc/2025-12-18-c203e6a4e13f3b90651ef6d7ae7df1e4.webp
          - https://t.alcy.cc/pic/pc/2025-12-244877eb3b28473eb63ca9fd66be5146.webp
          - https://t.alcy.cc/pic/pc/2026-02-15-15b3912819b0d689709ecd139a22a89f.webp
          - https://t.alcy.cc/pic/pc/2026-04-03-eb11cb3c33b2d6d7f41d9d7da1c5d8a6.webp
          - https://t.alcy.cc/pic/pc/369.webp
          - https://t.alcy.cc/pic/pc/372.webp
          - https://t.alcy.cc/pic/pc/380.webp
          - https://t.alcy.cc/pic/pc/388.webp
          - https://t.alcy.cc/pic/pc/465.webp
          - https://t.alcy.cc/pic/pc/480.webp
          - https://t.alcy.cc/pic/pc/550.webp
          - https://t.alcy.cc/pic/pc/56d271aed635e1e2621daf9eb2c9eec4.webp
          - https://t.alcy.cc/pic/pc/7c073ee2793294320c4d1b0132c8c5a4.webp
        copyright:
          # 前景圆形头像；author_background 只是背后那层背景图
          author: https://avatars.githubusercontent.com/u/116237950?v=4
          author_background: ""
      meta:
        pv: false
        comment: false
      covercolor:
        enable: true
        mode: local
      award:
        enable: false
        list: []
      share:
        enable: false
        list: []
    footer:
      information:
        author: https://avatars.githubusercontent.com/u/116237950?v=4
        left:
          - name: GitHub
            url: https://github.com/jiangbyte
            icon: fab fa-github
        right:
          - name: 订阅
            url: /index.xml
            icon: fas fa-rss
      group:
        探索:
          - name: 文章
            url: /archives/
          - name: 分类
            url: /categories/
          - name: 标签
            url: /tags/
        关于:
          - name: 关于
            url: /about/
          - name: Resume
            url: https://jiangbyte.cn/resume
      links:
        - name: 订阅
          url: /index.xml
    comment:
      use: ""
      commentBarrage: false
      lazyload: false
      count: false
      sidebar: false
      pv: false
      newest_comment:
        enable: false
    console:
      recentComment:
        enable: false
    right_menu:
      commentBarrage: false
    recent_comments:
      enable: false
    brevity:
      enable: false
    envelope:
      enable: false
    capsule:
      enable: false
    music:
      enable: false
    keyboard:
      enable: true
      list:
        - modifier: shift
          key: K
          action: toggleKeyboard
        - modifier: shift
          key: D
          action: toggleTheme
        - modifier: mod
          key: F
          action: openSearch
        - modifier: shift
          key: R
          action: randomPost
        - name: 返回首页
          modifier: shift
          key: H
          url: ./
    highlight:
      enable: true
      copy: true
      line_numbers: true
      max_height: 360
      themes:
        light: github-light
        dark: github-dark
    lightbox: fancybox
    cdn:
      shiki: https://esm.sh/shiki@4.4.3
    search:
      enable: true
      type: local
      local:
        preload: true
        CDN: /search.xml
