baseURL: https://jiangbyte.github.io/
title: 撷时录
locale: zh-CN
defaultContentLanguage: zh-cn
timeZone: Asia/Shanghai
enableRobotsTXT: true
enableGitInfo: false
theme: solitude

uglyURLs:
  posts: true

outputs:
  home: [HTML, RSS, Search, Links]
  section: [HTML, RSS]
  taxonomy: [HTML, RSS]
  term: [HTML, RSS]

pagination:
  pagerSize: 12

permalinks:
  posts: /p/:slug

menus:
  main:
    - name: 文库
      identifier: library
      weight: 10
    - name: 全部文章
      pageRef: /archives
      parent: library
      weight: 10
      params:
        icon: fas fa-folder-closed
    - name: 全部分类
      pageRef: /categories
      parent: library
      weight: 20
      params:
        icon: fas fa-clone
    - name: 全部标签
      pageRef: /tags
      parent: library
      weight: 30
      params:
        icon: fas fa-tags
    - name: 关于
      pageRef: /about
      weight: 20
    - name: GitHub
      url: https://github.com/jiangbyte
      weight: 30

params:
  author:
    name: Charlie
    email: ""
  description: Charlie 的个人笔记与实践记录 · 撷时录
  solitude:
    site:
      name:
        class: text
        custom: 撷时录
      icon: https://avatars.githubusercontent.com/u/116237950?v=4
    nav:
      group:
        链接:
          - name: GitHub
            url: https://github.com/jiangbyte
            icon: /img/logo.png
          - name: Resume
            url: https://jiangbyte.cn/resume
            icon: /img/logo.png
    hometop:
      banner:
        title: 撷时录
        desc: Charlie 的笔记与实践记录
      recommendList: []
    aside:
      home:
        noSticky: about
        Sticky: newestPost,allInfo
      post:
        noSticky: about
        Sticky: newestPost,allInfo
      page:
        noSticky: about
        Sticky: newestPost,allInfo
      my_card:
        author:
          img: https://avatars.githubusercontent.com/u/116237950?v=4
          emoji: ""
        # 信息卡背景图（沉浸式）
