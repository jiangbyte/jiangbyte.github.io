baseURL: https://jiangbyte.github.io/
title: 撷时录
locale: zh-CN
defaultContentLanguage: zh-cn
timeZone: Asia/Shanghai
enableRobotsTXT: true
enableGitInfo: false
theme: solitude

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      footnote: true
      linkify: true
      strikethrough: true
      table: true
      taskList: true
      typographer: true
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
            - ['$', '$']
  highlight:
    noClasses: false
    lineNos: true
    lineNumbersInTable: false
    style: github
    tabWidth: 4
    anchorLineNos: false
    codeFences: true
    guessSyntax: false

uglyURLs:
  posts: true

outputs:
  home: [HTML, RSS, Search, Links]
  section: [HTML, RSS]
  taxonomy: [HTML, RSS]
  term: [HTML, RSS]

pagination:
  pagerSize: 12

permalinks:
  posts: /p/:contentbasename
  project: /projects/:contentbasename/
  projects: /projects/:contentbasename/

menus:
  main:
    - name: 文库
      identifier: library
      weight: 10
    - name: 全部文章
      pageRef: /archives
      parent: library
      weight: 10
      params:
        icon: fas fa-folder-closed
    - name: 全部分类
      pageRef: /categories
      parent: library
      weight: 20
      params:
        icon: fas fa-clone
    - name: 全部标签
      pageRef: /tags
      parent: library
      weight: 30
      params:
        icon: fas fa-tags
    - name: 关于
      pageRef: /about
      weight: 40
    - name: 项目
      pageRef: /projects
      weight: 20
    - name: GitHub
      url: https://github.com/jiangbyte
      weight: 30

params:
  author:
    name: Charlie
    email: ""
  description: Charlie 的个人笔记与实践记录 · 撷时录
  solitude:
    site:
      name:
        class: text
        custom: 撷时录
      icon: https://avatars.githubusercontent.com/u/116237950?v=4
    # 乳白毛玻璃：深暖石灰强调色（正文链接另用深墨色，避免灰脏字）
    theme_color:
      light: "#4f4a45"
      dark: "#e8e0d4"
      nav_hover_text:
        light: "#1a1816"
        dark: "#1b1c20"
    # Lock webfonts so OS/browser system stacks don't diverge
    font:
      font_size: 16px
      code_font_size: 15px
      font_family: "'Noto Sans SC', system-ui, sans-serif"
      code_font_family: "'JetBrains Mono', ui-monospace, monospace"
    nav:
      group:
        链接:
          - name: GitHub
            url: https://github.com/jiangbyte
            icon: fab fa-github
          - name: Resume
            url: https://jiangbyte.cn/resume
            icon: fas fa-file-lines
    hometop:
      banner:
        title: 撷时录
        desc: Charlie 的笔记与实践记录
      recommendList: []
    aside:
      home:
        noSticky: about
        Sticky: newestPost,allInfo
      post:
        noSticky: about
        Sticky: newestPost,allInfo
      page:
        noSticky: about
        Sticky: newestPost,allInfo
      my_card:
        author:
          img: https://avatars.githubusercontent.com/u/116237950?v=4
          emoji: ""
        # 信息卡背景图（沉浸式）；?u= 与文章封面错开，避免同页同图
        background: https://t.alcy.cc/fj?u=aside
        description: Programming enthusiast based in GZ, CN.
        content: 写清楚，再优化 · 先跑通，再抽象
        witty_words: [写清楚，再优化, 先跑通，再抽象]
        information:
          - name: GitHub
            url: https://github.com/jiangbyte
            icon: fab fa-github
          - name: Resume
            url: https://jiangbyte.cn/resume
            icon: fas fa-file-lines
      siteinfo:
        runtime: 2026-10-01 00:00:00
      toc:
        vague: false
    post:
      default:
        # 无封面时按列表下标轮换；每条 ?u= 不同，同页多次请求不会撞缓存
        # 同步脚本会写入 https://t.alcy.cc/fj?u=<path-hash>
        cover:
          - https://t.alcy.cc/fj?u=d00
          - https://t.alcy.cc/fj?u=d01
          - https://t.alcy.cc/fj?u=d02
          - https://t.alcy.cc/fj?u=d03
          - https://t.alcy.cc/fj?u=d04
          - https://t.alcy.cc/fj?u=d05
          - https://t.alcy.cc/fj?u=d06
          - https://t.alcy.cc/fj?u=d07
          - https://t.alcy.cc/fj?u=d08
          - https://t.alcy.cc/fj?u=d09
          - https://t.alcy.cc/fj?u=d10
          - https://t.alcy.cc/fj?u=d11
          - https://t.alcy.cc/fj?u=d12
          - https://t.alcy.cc/fj?u=d13
          - https://t.alcy.cc/fj?u=d14
          - https://t.alcy.cc/fj?u=d15
          - https://t.alcy.cc/fj?u=d16
          - https://t.alcy.cc/fj?u=d17
          - https://t.alcy.cc/fj?u=d18
          - https://t.alcy.cc/fj?u=d19
          - https://t.alcy.cc/fj?u=d20
          - https://t.alcy.cc/fj?u=d21
          - https://t.alcy.cc/fj?u=d22
          - https://t.alcy.cc/fj?u=d23
          - https://t.alcy.cc/fj?u=d24
          - https://t.alcy.cc/fj?u=d25
          - https://t.alcy.cc/fj?u=d26
          - https://t.alcy.cc/fj?u=d27
          - https://t.alcy.cc/fj?u=d28
          - https://t.alcy.cc/fj?u=d29
          - https://t.alcy.cc/fj?u=d30
          - https://t.alcy.cc/fj?u=d31

        copyright:
          # 前景圆形头像；author_background 只是背后那层背景图
          author: https://avatars.githubusercontent.com/u/116237950?v=4
          author_background: ""
      meta:
        pv: false
        comment: false
      # 关闭取色，避免封面把主题色染回蓝紫
      covercolor:
        enable: false
        mode: local
      award:
        enable: false
        list: []
      share:
        enable: false
        list: []
    footer:
      information:
        author: https://avatars.githubusercontent.com/u/116237950?v=4
        left: []
        right: []
      group: {}
      links: []
      # 个人媒体入口：图标取自各官网/官方 CDN（/static/img/media/）
      media:
        - name: 微信
          img: /img/media/wechat.png
          tip: 微信公众号（占位）
          qr: /img/wechat-qr-placeholder.png
        - name: 邮箱
          icon: fas fa-envelope
          url: mailto:work@example.com
          tip: work@example.com
        - name: B站
          img: /img/media/bilibili.png
          url: https://space.bilibili.com/0
          tip: Bilibili（占位）
        - name: 掘金
          img: /img/media/juejin.svg
          url: https://juejin.cn/user/0
          tip: 掘金（占位）
        - name: Gitee
          img: /img/media/gitee.png
          url: https://gitee.com/jiangbyte
          tip: Gitee（占位）
        - name: GitHub
          icon: fab fa-github
          url: https://github.com/jiangbyte
          tip: GitHub
        - name: 订阅
          icon: fas fa-rss
          url: /index.xml
          tip: RSS 订阅
      # 备案信息：ICP 用 name/url；公安备案直接粘贴平台提供的官方 HTML
      beian:
        - name: 粤ICP备xxxxxxxx号
          url: https://beian.miit.gov.cn/
        - html: |
            <a target="_blank" rel="noopener noreferrer" href="https://www.beian.gov.cn/portal/registerSystemInfo?recordcode=xxxxxxxxxxxxxxxx" style="display:inline-flex;align-items:center;gap:4px;text-decoration:none;height:20px;line-height:20px;">
              <img src="https://www.beian.gov.cn/img/ghs.png" alt="" style="float:left;">
              <span style="float:left;height:20px;line-height:20px;margin:0 0 0 5px;color:#939393;">粤公网安备xxxxxxxxxxxxxxxx号</span>
            </a>
    comment:
      use: ""
      commentBarrage: false
      lazyload: false
      count: false
      sidebar: false
      pv: false
      newest_comment:
        enable: false
    console:
      recentComment:
        enable: false
    right_menu:
      commentBarrage: false
    recent_comments:
      enable: false
    brevity:
      enable: false
    envelope:
      enable: false
    capsule:
      enable: false
    music:
      enable: false
    errorpage:
      img: https://avatars.githubusercontent.com/u/116237950?v=4
      text: 页面走丢了，回首页看看吧
      recommendList: true
    keyboard:
      enable: true
      list:
        - modifier: shift
          key: K
          action: toggleKeyboard
        - modifier: shift
          key: D
          action: toggleTheme
        - modifier: mod
          key: F
          action: openSearch
        - modifier: shift
          key: R
          action: randomPost
        - name: 返回首页
          modifier: shift
          key: H
          url: ./
    highlight:
      # Chroma at build time (layouts/_markup/render-codeblock.html); skip CDN Shiki
      enable: false
      copy: true
      line_numbers: true
      max_height: 360
      themes:
        light: github-light
        dark: github-dark
    mermaid: true
    katex:
      enable: true
      per_page: true
      copytex: true
    lightbox: fancybox
    cdn:
      shiki: https://esm.sh/shiki@4.4.3
      mermaid: https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.min.js
      katex_js: https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.js
      katex_auto_render: https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/contrib/auto-render.min.js
    search:
      enable: true
      type: local
      local:
        preload: true
        CDN: /search.xml
