name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [notes-updated, content-updated]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout Notes + Projects source
        uses: actions/checkout@v4
        with:
          repository: jiangbyte/jiangbyte
          path: _notes_src
          sparse-checkout: |
            Notes
            Projects
          sparse-checkout-cone-mode: true

      - name: Sync Notes into content/posts (build only)
        run: python3 scripts/sync_notes.py "$GITHUB_WORKSPACE/_notes_src/Notes"

      - name: Sync Projects into content/projects (build only)
        run: python3 scripts/sync_projects.py "$GITHUB_WORKSPACE/_notes_src/Projects"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.167.0"
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy public/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
