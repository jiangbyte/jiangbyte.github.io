{{ define "main" }}
  <main class="layout" id="content-inner">
    <div id="tag">
      <div class="article-sort-title">{{ .Title }}</div>
      <div class="article-sort">
        {{ range $index, $page := .Pages.ByDate.Reverse }}
          {{ partial "archive-item.html" (dict "page" $page "index" $index) }}
        {{ end }}
      </div>
    </div>
    {{ partial "aside.html" . }}
  </main>
{{ end }}
